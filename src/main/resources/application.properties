spring.application.name=NickFinance

# Porta: o Render (e outros hosts) informa pela variavel PORT.
server.port=${PORT:8080}

# Banco de dados. Em producao, defina SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
# e SPRING_DATASOURCE_PASSWORD; os valores abaixo sao os do Postgres local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estoque}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Poucas conexoes: o plano gratuito do Neon e o servidor de 512 MB nao precisam de mais.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Cria/atualiza as tabelas automaticamente ao subir.
spring.jpa.hibernate.ddl-auto=update

# Segredo usado para assinar os tokens de login. Em producao, defina JWT_SECRET
# (um texto longo e aleatorio). O valor padrao serve apenas para desenvolvimento.
jwt.secret=${JWT_SECRET:dev-nick-finance-segredo-local-nao-use-em-producao}

# Bot do Telegram (opcional). Sem token, o bot fica desligado.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}

# Assistente Nino (opcional). Sem chave, a tela informa que ele esta desligado.
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
nino.limite-diario=${NINO_LIMITE_DIARIO:30}

# Integracao bancaria pela Pluggy (opcional). Sem client id e secret, a tela informa que esta desligada.
pluggy.client-id=${PLUGGY_CLIENT_ID:}
pluggy.client-secret=${PLUGGY_CLIENT_SECRET:}
# Mostra os bancos de teste da Pluggy no widget de conexao.
pluggy.incluir-sandbox=${PLUGGY_INCLUIR_SANDBOX:true}

# Configuracoes locais (tokens, senhas). Arquivo fora do git; veja local.properties.example.
spring.config.import=optional:file:./local.properties
